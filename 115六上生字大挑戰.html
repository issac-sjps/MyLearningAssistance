<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本冊生字改錯字大挑戰 — 1至8課</title>
<style>
:root{--paper:#eef3f0;--sheet:#fafcfa;--ink:#1b2a2e;--muted:#586b70;--grid:#afc6b8;--guide:#dce8e1;--line:#cfddd5;--pen:#d0322a;--pen-soft:#fbe4e1;--ok:#17724b;--ok-soft:#ddf1e5;--gold:#f2c94c;--gold-ink:#3b2a00;--focus:#2b63d9;--blue:#1f4e79;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--cell:clamp(38px,10.5vw,56px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding:20px 16px 48px}
button,input{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{text-align:center}
h1{margin:6px 0 2px;font-family:var(--serif);font-size:32px}
.sub{color:var(--muted);margin:0}
.badge{display:inline-block;background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{margin:0 0 10px;font-size:22px}
h3{margin:14px 0 8px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lesson{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;min-height:132px}
.lesson:hover{border-color:var(--ok)}
.lesson b{font-size:20px}
.lesson .n{font-size:14px;color:var(--muted);margin-top:4px}
.lesson .best{margin-top:8px;font-size:14px;color:var(--ok);font-weight:700}
.lesson .best.empty{color:var(--muted);font-weight:400}
.bigrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:52px;padding:10px 20px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.45}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:10px 4px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{padding:1px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--muted)}
.step.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.step.done{border-color:var(--ok);color:var(--ok);font-weight:700}
.stats{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink)}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:6px}
.prog i{height:6px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--ok)} .prog i.miss{background:var(--pen)} .prog i.cur{background:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.cell{position:relative;width:var(--cell);height:var(--cell);padding:0;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:3px;font-family:var(--serif);font-weight:500;font-size:calc(var(--cell)*.6);line-height:1;background:var(--sheet);background-image:linear-gradient(var(--guide),var(--guide)),linear-gradient(var(--guide),var(--guide));background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
button.cell{cursor:pointer}
button.cell:hover:not(:disabled){border-color:var(--ink)}
button.cell:disabled{cursor:default}
.cell.punct{border-color:var(--line);color:var(--muted)}
.cell.circled{border-color:var(--pen);border-radius:50%;box-shadow:0 0 0 2px var(--pen)}
.cell.nope{border-color:var(--pen);background-color:var(--pen-soft);animation:shake .4s}
.cell.fixed{border-color:var(--pen)}
.cell.fixed .new{color:var(--pen);font-weight:700}
.cell.fixed .old{position:absolute;right:3px;bottom:1px;font-size:calc(var(--cell)*.3);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.prompt{margin:14px 0 0;font-size:18px}
.prompt b{margin-right:.6em}
.msg{margin:6px 0 0;min-height:1.65em;color:var(--pen);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.opt{min-height:68px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer;font-family:var(--serif);font-weight:500;font-size:34px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.bad{border-color:var(--pen);color:var(--pen);opacity:.6;text-decoration:line-through;cursor:default}
.typerow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.typerow input{width:7em;min-height:60px;border:1.5px solid var(--grid);border-radius:8px;background:var(--sheet);text-align:center;font-family:var(--serif);font-size:30px}
.fb{padding:14px 16px;border-radius:8px;margin-top:14px}
.fb.good{background:var(--ok-soft)} .fb.fix{background:var(--pen-soft)}
.fb h2{margin:0;font-size:18px} .fb.good h2{color:var(--ok)} .fb.fix h2{color:var(--pen)}
.fb p{margin:4px 0 0}
.chg{font-family:var(--serif);font-size:22px}
.chg del{color:var(--muted);text-decoration-color:var(--pen);text-decoration-thickness:2px}
.chg ins{color:var(--pen);font-weight:700;text-decoration:none}
.score{font-size:64px;font-weight:800;line-height:1.1;margin:6px 0}
.review{list-style:none;margin:0;padding:0}
.review li{border-top:1px solid var(--line);padding:10px 0}
.ztable{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.zcell{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer}
.zcell .c{font-size:36px;line-height:1.1}.zcell .z{font-size:14px;color:var(--blue)}.zcell .w{font-size:13px;color:var(--muted)}
@media (max-width:460px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:26px}}
@media print{body{background:#fff}.noprint{display:none!important}.card{border:1px solid #999;break-inside:avoid}}
</style>
</head>

}
function makeQ(ch,pool,frameIdx,wrongChar){
  var word=wordOf(ch), p=ch.p||0;
  var ww=word.split(""); ww[p]=wrongChar; ww=ww.join("");
  var sentence=FRAMES[frameIdx%FRAMES.length].replace("{W}",ww);
  var start=sentence.indexOf("「")+1, idx=start+p;
  if(sentence[idx]!==wrongChar){idx=sentence.indexOf(wrongChar);}
  var others=shuffle(pool.filter(function(x){return x.c!==ch.c&&x.c!==wrongChar;}).map(function(x){return x.c;})).slice(0,2);
  var explain="「"+ww+"」應改為「"+word+"」。" + ch.c+" "+ch.z+(ch.w?(" — 「"+ch.w+"」"):"");
  return {ch:ch,wrong:wrongChar,chars:Array.from(sentence),idx:idx,options:shuffle([ch.c,wrongChar].concat(others)),answer:ch.c,explain:explain,sentence:sentence};
}
function norm(ch,lesson){return {lesson:lesson,c:ch.c,z:ch.z,w:ch.w,p:ch.p};}
function twoQs(ch,pool,base){
  var w=wrongCandidates(ch,pool);
  return [makeQ(ch,pool,base,w[0]),makeQ(ch,pool,base+7,w[1]||w[0])];
}
function questionsForLesson(L){
  var qs=[]; L.chars.forEach(function(ch,i){qs=qs.concat(twoQs(norm(ch,L.lesson),L.chars,i*2));});
  return shuffle(qs);
}
function balancedDeck(chars,n,lesson){
  var list=chars.map(function(ch){return norm(ch,lesson||ch.lesson);});
  var per={}; list.forEach(function(ch,i){var pool=lesson?DATA[lesson-1].chars:DATA[ch.lesson-1].chars;per[keyOf(ch)]=twoQs(ch,pool,i*2);});
  var order=shuffle(list.slice()),deck=[],round=0;
  while(deck.length<n){
    var added=false;
    order.forEach(function(ch){if(deck.length<n){var a=per[keyOf(ch)];if(round<a.length){deck.push(a[round]);added=true;}}});
    if(!added)break; round++;
  }
  return shuffle(deck);
}
function totalQuestions(){var n=0;DATA.forEach(function(L){n+=L.chars.length*2;});return n;}
var app=document.getElementById("app");
var S={view:"home",deck:[],i:0,ok:0,results:[],title:"",scope:"",mode:"choice",step:"find",errs:0,solved:false,revealed:false,msg:"",shake:-1,bad:{},curLesson:0,charsN:0};
function renderHome(){
  var best=getBest(), missed=getMissed().length;
  var h='<header><span class="badge">本冊生字 · 共 143 字 · 改錯字題庫 '+totalQuestions()+' 題</span>'+
    '<h1>✏️ 本冊生字改錯字大挑戰</h1><p class="sub">先選一課，再選要練多少題。每一個字最少有 2 題改錯字句：先點出錯字，再用紅筆改正。</p></header>';
  h+='<div class="grid2">';
  DATA.forEach(function(L){
    var k="L"+L.lesson,b=best[k];
    var btxt=b?("最佳 "+b.ok+"/"+b.n+(b.ok===b.n?" ★全對":"")):"還沒練過";
    h+='<button class="lesson" data-lesson="'+L.lesson+'"><b>'+lessonName(L.lesson)+'</b>'+
      '<div class="n">'+L.chars.length+' 個生字 · 改錯字 '+L.chars.length*2+' 題</div>'+
      '<div class="n">'+L.chars.map(function(x){return x.c;}).join(" ")+'</div>'+
      '<div class="best '+(b?"":"empty")+'">'+btxt+'</div></button>';
  });
  h+='</div>';
  h+='<div class="card"><h2>🏆 全冊總複習 / 錯題本</h2><div class="bigrow noprint">'+
    '<button class="btn green" data-all="full">全冊完整練習（286 題）</button>'+
    '<button class="btn" data-all="40">全冊快速 40 題</button>'+
    '<button class="btn ghost" data-missed>錯題本練習（'+missed+' 字）</button>'+
    '<button class="btn ghost" data-list>📋 看全部生字表</button></div>'+
    '<p class="muted">玩法跟改錯字練習一樣：第一步點出句子裡寫錯的那個字，第二步選出正確的字。答錯的字會自動收進錯題本，存在這台裝置的瀏覽器裡。</p></div>';
  h+='<div class="card noprint"><h2>老師說明</h2><p class="muted">1. 點一課 → 選「完整練習」就是那一課的全部改錯字句，每個字至少 2 題；趕時間就選「快速 20 題」或「快速 40 題」。<br>'+
  '2. 錯字優先選同音或同課的字，例如「拒」錯成「距」、「寓」錯成「鷸」，學生要真的會寫才改得出來。<br>'+
  '3. 點生字表裡任何一個字，可以只練那一個字（2 題）。<br>'+
  '4. 生字、注音、詞語都在檔案最前面的 DATA，錯了請直接改那裡，題目會自動跟著改。</p></div>';
  app.innerHTML=h;
}
function renderStart(lesson){
  S.curLesson=lesson;
  var L=DATA[lesson-1], best=getBest()["L"+lesson];
  var h='<div class="card"><p class="muted"><button class="linkbtn" data-home>← 回首頁</button></p>'+
    '<h2>'+lessonName(lesson)+' 改錯字 — '+L.chars.length+' 個生字</h2>'+
    '<p style="font-size:28px;letter-spacing:4px">'+L.chars.map(function(x){return x.c;}).join(" ")+'</p>'+
    (best?'<p class="muted">最佳成績：'+best.ok+' / '+best.n+'</p>':"")+
    '<h3>要練多少題？</h3><div class="bigrow">'+
    '<button class="btn green" data-start="full">完整練習（'+L.chars.length*2+' 題，每字至少 2 題）</button>'+
    '<button class="btn" data-start="20">快速 20 題</button>'+
    '<button class="btn" data-start="40">快速 40 題</button></div>'+
    '<h3>打字改正</h3><div class="bigrow"><button class="btn ghost" data-start="type">看句子，找出錯字後打字改正</button></div>'+
    '<p class="muted">每題兩步：① 點出句子裡寫錯的字 ② 選出（或打出）正確的字。兩步都一次答對才算全對。</p></div>';
  app.innerHTML=h;
}
function renderList(){
  var h='<div class="card noprint"><p><button class="linkbtn" data-home>← 回首頁</button></p><h2>📋 本冊生字表</h2>'+
    '<p class="muted">點任何一個字，可以只練那一個字的改錯字（2 題）。按「列印」可以印出這張表。</p>'+
    '<div class="bigrow"><button class="btn ghost" onclick="window.print()">🖨 列印生字表</button></div></div>';
  DATA.forEach(function(L){
    h+='<div class="card"><h3>'+lessonName(L.lesson)+'（'+L.chars.length+' 字）</h3><div class="ztable">'+
      L.chars.map(function(ch){
        return '<button class="zcell" data-char="'+esc(ch.c)+'"><div class="c">'+esc(ch.c)+'</div><div class="z">'+esc(ch.z)+'</div><div class="w">'+esc(ch.w||"")+'</div></button>';
      }).join("")+'</div></div>';
  });
  app.innerHTML=h;
}
function startQuiz(deck,title,scope,mode){
  S={view:"quiz",deck:deck,i:0,ok:0,results:[],title:title,scope:scope,mode:mode||"choice",step:"find",errs:0,solved:false,revealed:false,msg:"",shake:-1,bad:{},curLesson:S.curLesson,charsN:S.charsN};
  renderQuiz();
}
function resetQ(){S.step="find";S.errs=0;S.solved=false;S.revealed=false;S.msg="";S.shake=-1;S.bad={};}
function renderQuiz(){
  var q=S.deck[S.i], total=S.deck.length;
  var h='<div class="card"><div class="stats"><span>'+esc(S.title)+'</span><span>第 <b>'+(S.i+1)+'</b> / '+total+' 題 · 一次答對 <b>'+S.ok+'</b> 題</span></div>'+
    '<div class="prog">'+S.deck.map(function(_,k){var c=k<S.results.length?(S.results[k].ok?"ok":"miss"):(k===S.i?"cur":"");return '<i class="'+c+'"></i>';}).join("")+'</div>'+
    '<div class="steps" style="margin-top:12px"><span class="step '+(S.step==="find"?"on":"done")+'">1　找錯字</span><span class="step '+(S.solved?"done":(S.step==="fix"?"on":""))+'">2　改正</span></div>';
  var PUNCT=/[\p{P}\s]/u;
  h+='<div class="grid" style="margin-top:14px">'+q.chars.map(function(ch,i){
    if(PUNCT.test(ch))return '<span class="cell punct">'+esc(ch)+'</span>';
    if(i===q.idx&&S.solved)return '<span class="cell fixed"><span class="new">'+esc(q.answer)+'</span><span class="old">'+esc(q.wrong)+'</span></span>';
    var cls="cell"; if(i===q.idx&&S.step==="fix")cls+=" circled"; if(S.shake===i)cls+=" nope";
    return '<button type="button" class="'+cls+'" data-i="'+i+'"'+(S.step!=="find"?" disabled":"")+'>'+esc(ch)+'</button>';
  }).join("")+'</div>';
  if(S.solved){
    var perfect=S.results[S.results.length-1].ok, last=S.i>=S.deck.length-1;
    h+='<div class="fb '+(perfect?"good":"fix")+'"><h2>'+(perfect?"答對了！":(S.revealed?"正確答案在這裡":"改正完成"))+'</h2>'+
      '<p class="chg"><del>'+esc(q.wrong)+'</del> → <ins>'+esc(q.answer)+'</ins></p><p>'+esc(q.explain)+'</p></div>'+
      '<div class="bigrow" style="margin-top:12px"><button class="btn green" data-next>'+(last?"看成績":"下一題")+'</button></div>';
  }else if(S.step==="find"){
    h+='<p class="prompt"><b>點出錯字</b>點一下句子裡你覺得寫錯的那個字。</p><p class="msg">'+S.msg+'</p>'+
      '<div class="bigrow">'+(S.errs>=2?'<button class="linkbtn" data-reveal>直接看答案</button>':"")+'</div>';
  }else{
    h+='<p class="prompt"><b>改正</b>「'+esc(q.wrong)+'」要改成哪一個字？</p>';
    if(S.mode==="type"){
      h+='<form class="typerow" data-form><label for="ans">輸入正確的字</label><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2"><button type="submit" class="btn">確定</button></form>';
    }else{
      h+='<div class="opts">'+q.options.map(function(ch){var bad=S.bad[ch];return '<button type="button" class="opt'+(bad?" bad":"")+'" data-ch="'+esc(ch)+'"'+(bad?" disabled":"")+'>'+esc(ch)+'</button>';}).join("")+'</div>';
    }
    h+='<p class="msg">'+S.msg+'</p>';
    if(S.errs>=2)h+='<div class="bigrow"><button class="linkbtn" data-reveal>直接看答案</button></div>';
  }
  h+='<div class="bigrow" style="margin-top:12px"><button class="btn ghost" data-quit>結束，回首頁</button></div></div>';
  app.innerHTML=h;
  var inp=document.getElementById("ans"); if(inp)inp.focus();
}
function finish(ok){
  var q=S.deck[S.i];
  S.solved=true;S.step="fix";S.msg="";
  S.results.push({q:q,ok:ok});
  if(ok)removeMissed(keyOf(q.ch));else addMissed(keyOf(q.ch));
  renderQuiz();
}
function renderResult(){
  var total=S.deck.length, ok=S.ok, pct=total?Math.round(ok/total*100):0;
  var stars=pct>=90?"★★★":(pct>=70?"★★":"★");
  var wrong=S.results.filter(function(r){return !r.ok;});
  var h='<div class="card"><h2>🎉 '+esc(S.title)+' — 完成！</h2>'+
    '<p class="score">'+ok+' <span style="font-size:28px;color:var(--muted)">/ '+total+'</span></p>'+
    '<p style="font-size:22px">'+stars+'　答對率 '+pct+'%</p>'+
    '<p>'+(pct>=90?"幾乎全對，太厲害了！":pct>=70?"不錯，把下面錯的再看一遍。":"別灰心，錯的字已經收進錯題本，再練一次就會了。")+'</p>'+
    '<div class="bigrow"><button class="btn green" data-home>回首頁</button>'+
    (wrong.length?'<button class="btn" data-missed>練錯題（'+wrong.length+' 題）</button>':"")+'</div></div>';
  if(wrong.length){
    h+='<div class="card"><h2>錯題複習</h2><ul class="review">'+wrong.map(function(r){
      return '<li>'+esc(r.q.sentence)+'<br>錯字「'+esc(r.q.wrong)+'」應改為「'+esc(r.q.answer)+'」。'+esc(r.q.explain)+'</li>';
    }).join("")+'</ul></div>';
  }
  app.innerHTML=h;
}
app.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t)return;
  if(t.hasAttribute("data-home")){renderHome();return;}
  if(t.hasAttribute("data-list")){renderList();return;}
  if(t.hasAttribute("data-lesson")){renderStart(Number(t.getAttribute("data-lesson")));return;}
  if(t.hasAttribute("data-char")){
    var c=t.getAttribute("data-char");
    var ch=ALL.find(function(x){return x.c===c;});
    if(ch){S.charsN=1;startQuiz(shuffle(twoQs(ch,DATA[ch.lesson-1].chars,0)),"只練「"+c+"」的改錯字","single","choice");}
    return;
  }
  if(t.hasAttribute("data-start")){
    var lesson=S.curLesson, L=DATA[lesson-1]; S.charsN=L.chars.length;
    var mode=t.getAttribute("data-start");
    if(mode==="type")startQuiz(questionsForLesson(L),lessonName(lesson)+" 打字改正","L"+lesson,"type");
    else if(mode==="full")startQuiz(questionsForLesson(L),lessonName(lesson)+" 完整練習","L"+lesson,"choice");
    else startQuiz(balancedDeck(L.chars,Number(mode),lesson),lessonName(lesson)+" 快速 "+mode+" 題","L"+lesson,"choice");
    return;
  }
  if(t.hasAttribute("data-all")){
    var m=t.getAttribute("data-all"); S.charsN=143;
    if(m==="full"){var d=[];DATA.forEach(function(L){d=d.concat(questionsForLesson(L));});startQuiz(shuffle(d),"全冊完整練習","all","choice");}
    else startQuiz(balancedDeck(ALL,40),"全冊快速 40 題","all","choice");
    return;
  }
  if(t.hasAttribute("data-missed")){
    var missed=getMissed().map(function(k){return ALL.find(function(x){return keyOf(x)===k;});}).filter(Boolean);
    if(!missed.length){alert("錯題本是空的，先去練一課吧！");return;}
    S.charsN=missed.length;
    startQuiz(balancedDeck(missed,Math.min(40,missed.length*2)),"錯題本練習","missed","choice");
    return;
  }
  if(S.view!=="quiz")return;
  var q=S.deck[S.i];
  if(t.hasAttribute("data-i")&&S.step==="find"){
    var i=Number(t.getAttribute("data-i"));
    if(i===q.idx){S.step="fix";S.msg="";S.shake=-1;renderQuiz();}
    else{S.errs++;S.msg="「"+q.chars[i]+"」沒有錯，再找找看。";S.shake=i;renderQuiz();}
    return;
  }
  if(t.hasAttribute("data-reveal")){S.revealed=true;finish(false);return;}
  if(t.hasAttribute("data-ch")&&S.step==="fix"&&!S.solved){
    var ch=t.getAttribute("data-ch");
    if(ch===q.answer)finish(S.errs===0);
    else{S.bad[ch]=true;S.errs++;S.msg="不是「"+ch+"」，再想想。";renderQuiz();}
    return;
  }
  if(t.hasAttribute("data-next")){
    if(S.i>=S.deck.length-1){saveBest(S.scope,S.ok,S.deck.length);S.view="result";renderResult();}
    else{S.i++;resetQ();renderQuiz();}
    return;
  }
  if(t.hasAttribute("data-quit")){if(confirm("要結束這次練習嗎？"))renderHome();return;}
});
app.addEventListener("submit",function(e){
  if(!e.target.hasAttribute("data-form"))return;
  e.preventDefault();
  var q=S.deck[S.i]; if(!q||S.solved)return;
  var v=document.getElementById("ans").value.trim();
  if(!v){S.msg="請先輸入一個字。";renderQuiz();return;}
  if(v.length>1){S.msg="只要輸入一個字喔。";renderQuiz();return;}
  if(v[0]===q.answer)finish(S.errs===0);
  else{S.errs++;S.msg="不是「"+v[0]+"」，再想想。";renderQuiz();}
});
document.addEventListener("keydown",function(e){
  if(S.view!=="quiz"||S.solved||S.step!=="fix"||S.mode!=="choice")return;
  var q=S.deck[S.i]; var n=parseInt(e.key,10);
  if(n>=1&&n<=q.options.length){
    var ch=q.options[n-1];
    if(ch===q.answer)finish(S.errs===0);
    else{S.bad[ch]=true;S.errs++;S.msg="不是「"+ch+"」，再想想。";renderQuiz();}
  }
});
renderHome();
</script>
