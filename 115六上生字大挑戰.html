<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<title>本冊生字大挑戰 — 1至8課生字練習</title>
<style>
/* 單檔、不用連網，iPad / 電腦 / 手機都能開。老師要改生字：只改下面 <script> 裡的 DATA。 */
:root{
  --paper:#f2f7f3; --card:#ffffff; --ink:#1d2b22; --muted:#5b6f62;
  --line:#d7e4d9; --green:#1e7a46; --green-soft:#ddf1e5; --red:#c0272d; --red-soft:#fbe4e1;
  --gold:#f2c94c; --blue:#1f4e79; --blue-soft:#e2eef8; --orange:#c2410c;
  --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding:16px 16px 64px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:920px;margin:0 auto}
header{text-align:center;padding:8px 4px 4px}
h1{margin:6px 0 2px;font-size:34px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 14px}
.badge{display:inline-block;background:var(--gold);border-radius:99px;padding:2px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
h2{margin:0 0 10px;font-size:22px}
h3{margin:14px 0 8px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lesson{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;min-height:132px}
.lesson:hover{border-color:var(--green)}
.lesson b{font-size:20px}
.lesson .n{font-size:15px;color:var(--muted);margin-top:4px}
.lesson .best{margin-top:8px;font-size:14px;color:var(--green);font-weight:700}
.lesson .best.empty{color:var(--muted);font-weight:400}
.bigrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:52px;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:10px 4px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 12px;margin:2px 4px 2px 0;font-size:14px;color:var(--muted)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 題目區 */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.prog{height:10px;background:#e6efe8;border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--green);width:0}
.q{font-size:26px;font-weight:700;margin:14px 0 6px;line-height:1.5}
.q .bigchar{font-size:64px;line-height:1.1}
.q .zy{font-size:30px;color:var(--blue)}
.hint{color:var(--muted);font-size:15px;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.opt{min-height:84px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:44px;font-weight:700;padding:8px}
.opt.zy{font-size:30px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:17px}
.fb.good{background:var(--green-soft);color:var(--green)}
.fb.bad{background:var(--red-soft);color:var(--red)}
.fb .ans{font-size:22px;font-weight:700}
.typein{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.typein input{flex:1;min-width:180px;min-height:64px;font-size:36px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:6px}
.typein input:focus{outline:3px solid #8db8ff}
/* 生字表 */
.ztable{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.zcell{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer}
.zcell:hover{border-color:var(--green)}
.zcell .c{font-size:36px;line-height:1.1}
.zcell .z{font-size:14px;color:var(--blue)}
.zcell .w{font-size:13px;color:var(--muted)}
.score{font-size:64px;font-weight:800;line-height:1.1;margin:6px 0}
.review{list-style:none;margin:0;padding:0}
.review li{border-top:1px solid var(--line);padding:10px 0}
@media (max-width:560px){
  h1{font-size:28px}.q{font-size:22px}.opt{font-size:36px;min-height:76px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .card{border:1px solid #999;break-inside:avoid}
}
</style>

var ALL=[]; DATA.forEach(function(L){L.chars.forEach(function(ch){ALL.push({lesson:L.lesson,c:ch.c,z:ch.z,w:ch.w,p:ch.p});});});
var CN=["零","一","二","三","四","五","六","七","八"];
function lessonName(n){return "第"+CN[n]+"課";}
/* ---------- 工具 ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(arr,n,exclude){var p=shuffle(arr.filter(function(x){return x!==exclude;}));return p.slice(0,n);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
function getMissed(){return store.get("sz-missed",[]);}
function addMissed(key){var m=getMissed();if(m.indexOf(key)<0){m.push(key);store.set("sz-missed",m);}}
function removeMissed(key){store.set("sz-missed",getMissed().filter(function(x){return x!==key;}));}
function getBest(){return store.get("sz-best",{});}
function saveBest(key,ok,n){var b=getBest();if(!b[key]||ok/n>b[key].ok/b[key].n){b[key]={ok:ok,n:n};store.set("sz-best",b);}}
function keyOf(ch){return ch.lesson+"-"+ch.c;}
function wordBlank(ch){if(!ch.w)return "";var a=ch.w.split("");a[ch.p]="＿";return a.join("");}
function wordShown(ch){return ch.w?("「"+ch.w+"」"): "—";}
/* ---------- 出題：每字至少有 注音選字、看字選注音 兩題，有詞語再加詞語填空 ---------- */
function qZy2Char(ch,pool){
  var others=pick(pool.map(function(x){return x.c;}),3,ch.c);
  return {type:"choice",kind:"注音選字",ch:ch,ask:'注音 <span class="zy">'+esc(ch.z)+'</span> 是哪一個字？',
    options:shuffle([ch.c].concat(others)),answer:ch.c,explain:ch.c+" "+ch.z+" — "+wordShown(ch)};
}
function qChar2Zy(ch,pool,allZy){
  var uniq=function(a){return a.filter(function(v,i){return a.indexOf(v)===i;});};
  var zys=pick(uniq(pool.map(function(x){return x.z;})),3,ch.z);
  if(zys.length<3){var extra=pick(uniq(allZy),3,ch.z);zys=uniq(zys.concat(extra)).slice(0,3);}
  return {type:"choice",kind:"看字選注音",ch:ch,ask:'「<span class="bigchar">'+esc(ch.c)+'</span>」的注音是哪一個？',
    options:shuffle([ch.z].concat(zys)),answer:ch.z,zy:true,explain:ch.c+" "+ch.z+" — "+wordShown(ch)};
}
function qWord(ch,pool){
  if(!ch.w)return null;
  var others=pick(pool.map(function(x){return x.c;}),3,ch.c);
  return {type:"choice",kind:"詞語填空",ch:ch,ask:'「'+esc(wordBlank(ch))+'」裡面，＿ 應該是哪一個字？',
    options:shuffle([ch.c].concat(others)),answer:ch.c,explain:ch.c+" "+ch.z+" — 「"+ch.w+"」"};
}
function qNotIn(lessonChars,allChars,lesson){
  var inside=pick(lessonChars,3,null).map(function(x){return x.c;});
  var outsiders=allChars.filter(function(x){return x.lesson!==lesson;});
  var out=outsiders[Math.floor(Math.random()*outsiders.length)];
  return {type:"choice",kind:"不是本課生字",ch:out,ask:"下面哪一個字<span style='color:var(--red)'>不是</span>"+lessonName(lesson)+"的生字？",
    options:shuffle(inside.concat([out.c])),answer:out.c,explain:"「"+out.c+"」是第"+CN[out.lesson]+"課的生字，不是"+lessonName(lesson)+"的。"};
}
function questionsFor(chars,lesson){
  var pool=chars, allZy=ALL.map(function(x){return x.z;});
  var qs=[];
  chars.forEach(function(ch){
    qs.push(qZy2Char(ch,pool));
    qs.push(qChar2Zy(ch,pool,allZy));
    var w=qWord(ch,pool); if(w)qs.push(w);
  });
  for(var i=0;i<5;i++)qs.push(qNotIn(chars,ALL,lesson));
  return shuffle(qs);
}
function balancedDeck(chars,lesson,n){
  /* 輪流取每一個字，保證先把每個字都練到一次，再練第二輪 */
  var pool=chars.length>=4?chars:ALL;
  var per={}; chars.forEach(function(ch){
    var arr=[qZy2Char(ch,pool),qChar2Zy(ch,pool,ALL.map(function(x){return x.z;}))];
    var w=qWord(ch,pool); if(w)arr.push(w);
    per[keyOf(ch)]=shuffle(arr);
  });
  var order=shuffle(chars.slice()),deck=[],round=0;
  while(deck.length<n){
    var added=false;
    order.forEach(function(ch){
      if(deck.length>=n)return;
      var a=per[keyOf(ch)]; if(round<a.length){deck.push(a[round]);added=true;}
    });
    if(!added)break; round++;
  }
  return shuffle(deck);
}
function typingDeck(chars){
  var qs=[];
  chars.forEach(function(ch){
    qs.push({type:"type",kind:"看注音寫字",ch:ch,ask:'注音 <span class="zy">'+esc(ch.z)+'</span>，請寫出這個字。',answer:ch.c,explain:ch.c+" "+ch.z+" — "+wordShown(ch)});
    if(ch.w)qs.push({type:"type",kind:"看詞語寫字",ch:ch,ask:'詞語「'+esc(wordBlank(ch))+'」，請寫出 ＿ 的字。',answer:ch.c,explain:ch.c+" "+ch.z+" — 「"+ch.w+"」"});
  });
  return shuffle(qs);
}

/* ---------- 畫面 ---------- */
var app=document.getElementById("app");
var S={view:"home",deck:[],i:0,ok:0,results:[],title:"",scope:"",mode:"choice",covered:{}};
function totalQuestions(){var n=0;DATA.forEach(function(L){n+=questionsFor(L.chars,L.lesson).length;});return n;}
function renderHome(){
  var best=getBest(), missed=getMissed().length;
  var h='<header><span class="badge">本冊生字 · 共 143 字 · 題庫 '+totalQuestions()+' 題</span>'+
    '<h1>📖 本冊生字大挑戰</h1><p class="sub">先選一課，再選要練多少題。每一個字最少有 2 題：注音選字＋看字選注音。</p></header>';
  h+='<div class="grid">';
  DATA.forEach(function(L){
    var k="L"+L.lesson, b=best[k];
    var btxt=b?("最佳 "+b.ok+"/"+b.n+(b.ok===b.n?" ★全對":"")):"還沒練過";
    h+='<button class="lesson" data-lesson="'+L.lesson+'"><b>'+lessonName(L.lesson)+'</b>'+
      '<div class="n">'+L.chars.length+' 個生字 · 題庫 '+questionsFor(L.chars,L.lesson).length+' 題</div>'+
      '<div class="n">'+L.chars.map(function(x){return x.c;}).join(" ")+'</div>'+
      '<div class="best '+(b?"":"empty")+'">'+btxt+'</div></button>';
  });
  h+='</div>';
  h+='<div class="card"><h2>🏆 全冊總複習 / 錯題本</h2><div class="bigrow noprint">'+
    '<button class="btn green" data-all="full">全冊完整練習</button>'+
    '<button class="btn" data-all="40">全冊快速 40 題</button>'+
    '<button class="btn ghost" data-missed>錯題本練習（'+missed+' 字）</button>'+
    '<button class="btn ghost" data-list>📋 看全部生字表</button></div>'+
    '<p class="muted">全冊完整練習：每課每字都出題，適合考前總複習；快速 40 題會輪流取每課的字，不會一直重複同一字。答錯的字會自動收進錯題本，存在這台裝置的瀏覽器裡。</p></div>';
  h+='<div class="card noprint"><h2>老師說明</h2><p class="muted">1. 點一課 → 選「完整練習」就是那一課的全部題目，每個字至少 2 題；趕時間就選「快速 20 題」或「快速 40 題」。<br>'+
  '2. 點生字表裡任何一個字，可以只練那一個字（3 題）。<br>'+
  '3. 成績和錯題只存在這台裝置，不用登入、不用連網，換一台裝置要重練。<br>'+
  '4. 生字、注音、詞語都在檔案最前面的 DATA，錯了請直接改那裡，題目會自動跟著改。</p></div>';
  app.innerHTML=h;
}
function renderStart(lesson){
  var L=DATA[lesson-1], best=getBest()["L"+lesson];
  var h='<div class="card"><p class="muted"><button class="linkbtn" data-home>← 回首頁</button></p>'+
    '<h2>'+lessonName(lesson)+' — '+L.chars.length+' 個生字</h2>'+
    '<p style="font-size:28px;letter-spacing:4px">'+L.chars.map(function(x){return x.c;}).join(" ")+'</p>'+
    (best?'<p class="muted">最佳成績：'+best.ok+' / '+best.n+'</p>':"")+
    '<h3>要練多少題？</h3><div class="bigrow">'+
    '<button class="btn green" data-start="full">完整練習（'+questionsFor(L.chars,lesson).length+' 題，每字至少 2 題）</button>'+
    '<button class="btn" data-start="20">快速 20 題</button>'+
    '<button class="btn" data-start="40">快速 40 題</button></div>'+
    '<h3>打字練習</h3><div class="bigrow"><button class="btn ghost" data-start="type">看注音寫字（'+typingDeck(L.chars).length+' 題）</button></div>'+
    '<p class="muted">完整練習題型：注音選字、看字選注音、詞語填空、不是本課生字。快速題會先把每個字輪流練一遍，再練第二輪。</p></div>';
  app.innerHTML=h;
}
function renderList(){
  var h='<div class="card noprint"><p><button class="linkbtn" data-home>← 回首頁</button></p><h2>📋 本冊生字表</h2>'+
    '<p class="muted">點任何一個字，可以只練那一個字。按「列印」可以印出這張表。</p>'+
    '<div class="bigrow"><button class="btn ghost" onclick="window.print()">🖨 列印生字表</button></div></div>';
  DATA.forEach(function(L){
    h+='<div class="card"><h3>'+lessonName(L.lesson)+'（'+L.chars.length+' 字）</h3><div class="ztable">'+
      L.chars.map(function(ch){
        return '<button class="zcell" data-char="'+lessonName(L.lesson)+'" data-c="'+esc(ch.c)+'"><div class="c">'+esc(ch.c)+'</div><div class="z">'+esc(ch.z)+'</div><div class="w">'+esc(ch.w||"")+'</div></button>';
      }).join("")+'</div></div>';
  });
  app.innerHTML=h;
}
function startQuiz(deck,title,scope){
  S={view:"quiz",deck:deck,i:0,ok:0,results:[],title:title,scope:scope,mode:"choice",covered:{},answered:false,lastOk:false};
  renderQuiz();
}
function renderQuiz(){
  var q=S.deck[S.i], total=S.deck.length;
  var coveredN=Object.keys(S.covered).length;
  var totalChars=S.scope==="all"?143:(S.scope==="missed"?getMissed().length:(S.charsN||total));
  var h='<div class="card"><div class="qhead"><span>'+esc(S.title)+'</span><span>第 '+(S.i+1)+' / '+total+' 題 · 答對 '+S.ok+' 題</span></div>'+
    '<div class="prog"><i style="width:'+Math.round(S.i/total*100)+'%"></i></div>'+
    '<p class="muted">已練到 '+coveredN+' 個不同的字 · 本題型：'+q.kind+'</p>'+
    '<p class="q">'+q.ask+'</p>';
  if(q.type==="choice"){
    h+='<div class="opts">'+q.options.map(function(o,i){
      var cls=q.zy?"opt zy":"opt";
      return '<button class="'+cls+'" data-opt="'+esc(o)+'" data-i="'+i+'">'+esc(o)+'</button>';
    }).join("")+'</div><p class="hint">也可以按鍵盤 1–4 選答案。</p>';
  }else{
    h+='<form class="typein" data-form><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="寫一個字" maxlength="2">'+
      '<button class="btn" type="submit">確定</button></form><p class="hint">用裝置的注音鍵盤打出這個字，再按確定。</p>';
  }
  h+='<div id="fb"></div>';
  h+='<div class="bigrow" style="margin-top:12px"><button class="btn ghost" data-quit>結束，回首頁</button></div></div>';
  app.innerHTML=h;
  var inp=document.getElementById("ans"); if(inp)inp.focus();
}
function answer(value){
  if(S.answered)return;
  var q=S.deck[S.i]; S.answered=true;
  S.covered[keyOf(q.ch)]=true;
  var ok=value===q.answer;
  if(ok){S.ok++;removeMissed(keyOf(q.ch));}else{addMissed(keyOf(q.ch));}
  S.results.push({q:q,ok:ok,given:value});
  var fb=document.getElementById("fb");
  fb.innerHTML='<div class="fb '+(ok?"good":"bad")+'"><div class="ans">'+(ok?"⭕ 答對了！":"❌ 答錯了，正確答案是「"+esc(q.answer)+"」")+'</div><div>'+esc(q.explain)+'</div></div>'+
    '<div class="bigrow" style="margin-top:12px"><button class="btn green" data-next>'+(S.i>=S.deck.length-1?"看成績":"下一題 →")+'</button></div>';
  if(q.type==="choice"){
    document.querySelectorAll("[data-opt]").forEach(function(b){
      b.disabled=true;
      if(b.getAttribute("data-opt")===q.answer)b.classList.add("correct");
      else if(b.getAttribute("data-opt")===value)b.classList.add("wrong");
    });
  }
  var nx=document.querySelector("[data-next]"); if(nx)nx.focus();
}
function renderResult(){
  var total=S.deck.length, ok=S.ok, pct=total?Math.round(ok/total*100):0;
  var stars=pct>=90?"★★★":(pct>=70?"★★":"★");
  var wrong=S.results.filter(function(r){return !r.ok;});
  var h='<div class="card"><h2>🎉 '+esc(S.title)+' — 完成！</h2>'+
    '<p class="score">'+ok+' <span style="font-size:28px;color:var(--muted)">/ '+total+'</span></p>'+
    '<p style="font-size:22px">'+stars+'　答對率 '+pct+'%</p>'+
    '<p>'+(pct>=90?"幾乎全對，太厲害了！":pct>=70?"不錯，把下面錯的再看一遍。":"別灰心，錯的字已經收進錯題本，再練一次就會了。")+'</p>'+
    '<div class="bigrow"><button class="btn green" data-again>再練一次</button>'+
    (wrong.length?'<button class="btn" data-missed>練錯題（'+wrong.length+' 題）</button>':"")+
    '<button class="btn ghost" data-home>回首頁</button></div></div>';
  if(wrong.length){
    h+='<div class="card"><h2>錯題複習</h2><ul class="review">'+wrong.map(function(r){
      return '<li><b>'+esc(r.q.kind)+'</b>：'+r.q.ask+'<br>你選了「'+esc(r.given||"（沒寫）")+'」，正確是「'+esc(r.q.answer)+'」。'+esc(r.q.explain)+'</li>';
    }).join("")+'</ul></div>';
  }
  app.innerHTML=h;
}
/* ---------- 事件 ---------- */
app.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t)return;
  if(t.hasAttribute("data-home")){renderHome();return;}
  if(t.hasAttribute("data-list")){renderList();return;}
  if(t.hasAttribute("data-lesson")){renderStart(Number(t.getAttribute("data-lesson")));return;}
  if(t.hasAttribute("data-char")){
    var c=t.getAttribute("data-c");
    var ch=ALL.find(function(x){return x.c===c;});
    if(!ch)return;
    var qs=[qZy2Char(ch,DATA[ch.lesson-1].chars),qChar2Zy(ch,DATA[ch.lesson-1].chars,ALL.map(function(x){return x.z;}))];
    var w=qWord(ch,DATA[ch.lesson-1].chars); if(w)qs.push(w);
    S.charsN=1; startQuiz(shuffle(qs),"只練「"+c+"」","single"); return;
  }
  if(t.hasAttribute("data-start")){
    var lesson=Number((document.querySelector("[data-start]")||{}).getAttribute("data-lesson")||0);
    /* 從 renderStart 的按鈕取課別：用目前標題反推較不可靠，改用全域暫存 */
    lesson=S.curLesson||lesson;
    var L=DATA[lesson-1]; S.charsN=L.chars.length;
    var mode=t.getAttribute("data-start");
    if(mode==="type"){startQuiz(typingDeck(L.chars),lessonName(lesson)+" 打字練習","L"+lesson);}
    else if(mode==="full"){startQuiz(questionsFor(L.chars,lesson),lessonName(lesson)+" 完整練習","L"+lesson);}
    else{startQuiz(balancedDeck(L.chars,lesson,Number(mode)),lessonName(lesson)+" 快速 "+mode+" 題","L"+lesson);}
    return;
  }
  if(t.hasAttribute("data-all")){
    var m=t.getAttribute("data-all");
    S.charsN=143;
    if(m==="full"){var d=[];DATA.forEach(function(L){d=d.concat(questionsFor(L.chars,L.lesson));});startQuiz(shuffle(d),"全冊完整練習","all");}
    else{startQuiz(balancedDeck(ALL,0,40),"全冊快速 40 題","all");}
    return;
  }
  if(t.hasAttribute("data-missed")){
    var missed=getMissed().map(function(k){return ALL.find(function(x){return keyOf(x)===k;});}).filter(Boolean);
    if(!missed.length){alert("錯題本是空的，先去練一課吧！");return;}
    S.charsN=missed.length;
    startQuiz(balancedDeck(missed,missed[0].lesson,Math.min(40,missed.length*2)),"錯題本練習","missed");
    return;
  }
  if(t.hasAttribute("data-opt")&&!S.answered){answer(t.getAttribute("data-opt"));return;}
  if(t.hasAttribute("data-next")){
    if(S.i>=S.deck.length-1){saveBest(S.scope,S.ok,S.deck.length);S.view="result";renderResult();}
    else{S.i++;S.answered=false;renderQuiz();}
    return;
  }
  if(t.hasAttribute("data-quit")){if(confirm("要結束這次練習嗎？"))renderHome();return;}
  if(t.hasAttribute("data-again")){renderHome();return;}
});
/* renderStart 需記住目前課別 */
var _renderStart=renderStart;
renderStart=function(lesson){S.curLesson=lesson;_renderStart(lesson);};
app.addEventListener("submit",function(e){
  if(!e.target.hasAttribute("data-form"))return;
  e.preventDefault();
  var v=document.getElementById("ans").value.trim();
  if(!v){alert("請先寫一個字。");return;}
  answer(v.slice(0,1));
});
document.addEventListener("keydown",function(e){
  if(S.view!=="quiz"||S.answered)return;
  var q=S.deck[S.i]; if(!q||q.type!=="choice")return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=q.options.length){answer(q.options[n-1]);}
  if(e.key==="Enter"){var nx=document.querySelector("[data-next]");if(nx)nx.click();}
});
renderHome();
</script>
