<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#245db5">
<title>ABC 英文大小寫書寫闖關</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  color:#243247;background:#f3f6fb;
  --blue:#245db5; --blue2:#3185d8; --orange:#d97706; --green:#15945b; --red:#c2410c;
  --line:#dce4ef; --muted:#65758b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overscroll-behavior:none}
.app{
  height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  max-width:1200px;margin:0 auto;
}
header{display:flex;align-items:center;gap:12px;flex:none}
header h1{font-size:clamp(18px,3.2vmin,26px);margin:0;color:#1e477d;white-space:nowrap}
.progresswrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.progressnum{font-size:clamp(15px,2.6vmin,20px);font-weight:800;white-space:nowrap;color:var(--blue)}
.scorenum{display:flex;gap:6px;white-space:nowrap;font-weight:800;font-size:clamp(13px,2.4vmin,16px)}
.scorenum .ok{color:var(--green);background:#e7f6ee;border-radius:99px;padding:3px 10px}
.scorenum .no{color:var(--red);background:#fdeee7;border-radius:99px;padding:3px 10px}
.bar{height:12px;background:#e8eef6;border-radius:99px;overflow:hidden;flex:1}
.bar>div{height:100%;width:0;background:var(--blue2);transition:width .25s}
.muted{color:var(--muted);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #193b6412}
#game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.promptpanel{flex:none;text-align:center;padding:6px 10px 8px}
.direction{font-weight:700;color:var(--muted);font-size:clamp(14px,2.6vmin,18px)}
.promptrow{display:flex;justify-content:center;align-items:center;gap:clamp(12px,4vw,34px)}
.bigletter{font-size:clamp(52px,13vmin,96px);font-weight:850;line-height:1.05;color:var(--blue)}
.answerletter{color:var(--orange)}
.arrow{font-size:clamp(20px,4vmin,30px);color:#9aa8ba}
.hint{color:#8a6d1f;background:#fff8e1;border:1px dashed #e5c15c;border-radius:99px;display:inline-block;padding:3px 12px;font-size:clamp(12px,2.4vmin,15px);font-weight:700;margin-top:2px}
.writepanel{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 10px 10px}
.writehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex:none}
.writehead strong{font-size:clamp(14px,2.6vmin,17px)}
.pill{display:inline-block;background:#edf2f8;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;color:#40536e}
.guide{position:relative;flex:1;min-height:140px;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;background:#fff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.linelabel{position:absolute;left:6px;transform:translateY(-50%);font-size:11px;font-weight:800;color:#c0504d;background:#ffffffcc;padding:0 4px;border-radius:4px;pointer-events:none;z-index:2}
.linelabel.mid{color:#b7791f}.linelabel.base{color:#245db5}.linelabel.desc{color:#7c5cd6}
.actions{display:flex;gap:8px;margin-top:8px;flex:none}
button{border:0;border-radius:10px;padding:12px 14px;font-size:clamp(14px,2.6vmin,16px);font-weight:750;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--blue);color:#fff;flex:1.4}
.secondary{background:#fff;color:#30435e;border:1px solid #cbd5e1;flex:1}
.full{width:100%;margin-top:8px;flex:none}
.feedback{text-align:center;font-weight:750;min-height:22px;margin-top:7px;font-size:clamp(13px,2.6vmin,16px);flex:none}
.feedback .why{display:block;font-weight:600;font-size:.88em;margin-top:2px}
/* 橫向 iPad：左題目、右書寫，一頁完成 */
@media (orientation:landscape) and (min-width:700px){
  #game{flex-direction:row}
  .promptpanel{flex:0 0 30%;display:flex;flex-direction:column;justify-content:center}
  .promptrow{flex-direction:column;gap:2px}
  .arrow{transform:rotate(90deg)}
  .writepanel{flex:1}
}
#result{flex:1;min-height:0;overflow-y:auto;text-align:center;padding:16px}
.trophy{font-size:clamp(56px,12vmin,84px);line-height:1.1}
.trophy.gold{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.score{font-size:clamp(40px,9vmin,58px);font-weight:850;color:var(--blue);margin:6px}
.row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #e5eaf1;text-align:left}
.row img{width:110px;height:74px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}
.row .meta{flex:1;min-width:0}
footer{flex:none;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ABC 英文大小寫書寫闖關</h1>
    <div class="progresswrap" aria-label="測驗進度">
      <div class="progressnum" id="progress">第 1 / 30 題</div>
      <div class="bar"><div id="bar"></div></div>
      <div class="scorenum" aria-label="目前答對與答錯題數"><span class="ok">✓ 答對 <span id="liveCorrect">0</span></span><span class="no">✗ 答錯 <span id="liveWrong">0</span></span></div>
    </div>
    <button class="secondary" id="reshuffle" style="flex:none;padding:8px 12px">🔄 重新出題</button>
  </header>

  <section id="game">
    <section class="panel promptpanel">
      <div class="direction" id="direction">請寫出對應的英文字母</div>
      <div class="promptrow">
        <div><div class="muted">題目</div><div class="bigletter" id="prompt">A</div></div>
        <div class="arrow">→</div>
        <div><div class="muted">請寫</div><div class="bigletter answerletter" id="answer">?</div></div>
      </div>
      <div><span class="hint" id="hint">請在書寫格中寫字</span></div>
    </section>

    <section class="panel writepanel">
      <div class="writehead">
        <strong>✏️ 書寫練習區</strong>
        <span class="pill">上線・中線・下線・下伸線</span>
      </div>
      <div class="guide" id="guide">
        <span class="linelabel" data-line="top">上線</span>
        <span class="linelabel mid" data-line="mid">中線</span>
        <span class="linelabel base" data-line="base">下線</span>
        <span class="linelabel desc" data-line="desc">下伸線</span>
        <canvas id="canvas"></canvas>
      </div>
      <div class="actions">
        <button class="secondary" id="clear">清除重寫</button>
        <button class="secondary" id="undo">復原一筆</button>
        <button class="primary" id="check">確認答案 ✓</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="primary full" id="next" hidden>下一題 →</button>
    </section>
  </section>

  <section class="panel" id="result" hidden>
    <div class="trophy" id="trophy">📝</div>
    <h2 id="resultTitle" style="margin:4px 0">測驗完成！</h2>
    <div class="muted">本次練習成績</div>
    <div class="score" id="score">0 / 30</div>
    <div id="message" style="font-weight:750"></div>
    <p id="passText" style="color:#b98200;font-weight:700"></p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px">
      <span class="pill">答對 <b id="correct">0</b> 題</span>
      <span class="pill">答錯 <b id="wrong">0</b> 題</span>
    </div>
    <button class="secondary full" id="review">查看答錯題目</button>
    <div id="errors" hidden></div>
    <button class="primary full" id="restart">🔄 再練習一次（重新出題）</button>
  </section>

  <footer class="muted">看大寫寫小寫、看小寫寫大寫・每次隨機 30 題・練習不限次數</footer>
</div>

<script>
// ===== 字形辨識：模板比對（離線、單頁可用） =====
// 原理：把學生筆跡和字母模板都縮放成同一個小方格圖，再量兩邊筆跡的平均距離。
// 距離越小越像。不看筆順、粗細，只看形狀；大小寫位置仍由碰線判斷負責。

function arcPts(cx, cy, rx, ry, a0, a1, n) {
  n = n || 16;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
function cat() {
  const out = [];
  for (const part of arguments) for (const p of part) out.push(p);
  return out;
}

// 每個字母：筆畫陣列，每筆是 [x,y] 點陣列，座標約在 0..1 方框內（y 向下）
const TEMPLATES = {
  A: [[[0.02,0.98],[0.5,0.02],[0.98,0.98]], [[0.24,0.66],[0.76,0.66]]],
  B: [[[0.18,0.02],[0.18,0.98]],
      cat([[0.18,0.02],[0.55,0.02]], arcPts(0.55,0.24,0.24,0.22,-90,90), [[0.18,0.46]]),
      cat([[0.18,0.46],[0.58,0.46]], arcPts(0.58,0.72,0.27,0.26,-90,90), [[0.18,0.98]])],
  C: [arcPts(0.52,0.5,0.42,0.47,-52,-308)],
  D: [[[0.18,0.02],[0.18,0.98]],
      cat([[0.18,0.02],[0.52,0.02]], arcPts(0.52,0.5,0.38,0.48,-90,90), [[0.18,0.98]])],
  E: [[[0.82,0.02],[0.16,0.02],[0.16,0.98],[0.82,0.98]], [[0.16,0.5],[0.66,0.5]]],
  F: [[[0.82,0.02],[0.16,0.02],[0.16,0.98]], [[0.16,0.46],[0.62,0.46]]],
  G: [cat(arcPts(0.52,0.5,0.42,0.47,-52,-300), [[0.88,0.62],[0.88,0.54],[0.56,0.54]])],
  H: [[[0.16,0.02],[0.16,0.98]], [[0.84,0.02],[0.84,0.98]], [[0.16,0.5],[0.84,0.5]]],
  I: [[[0.5,0.02],[0.5,0.98]], [[0.24,0.02],[0.76,0.02]], [[0.24,0.98],[0.76,0.98]]],
  J: [cat([[0.78,0.02],[0.78,0.7]], arcPts(0.5,0.7,0.28,0.28,0,180))],
  K: [[[0.16,0.02],[0.16,0.98]], [[0.82,0.02],[0.2,0.5],[0.86,0.98]]],
  L: [[[0.16,0.02],[0.16,0.98],[0.82,0.98]]],
  M: [[[0.06,0.98],[0.06,0.02],[0.5,0.55],[0.94,0.02],[0.94,0.98]]],
  N: [[[0.1,0.98],[0.1,0.02],[0.9,0.98],[0.9,0.02]]],
  O: [arcPts(0.5,0.5,0.46,0.48,-90,270,24)],
  P: [[[0.18,0.98],[0.18,0.02]],
      cat([[0.18,0.02],[0.55,0.02]], arcPts(0.55,0.25,0.27,0.23,-90,90), [[0.18,0.48]])],
  Q: [arcPts(0.5,0.5,0.46,0.48,-90,270,24), [[0.62,0.76],[0.92,1.0]]],
  R: [[[0.18,0.98],[0.18,0.02]],
      cat([[0.18,0.02],[0.55,0.02]], arcPts(0.55,0.25,0.27,0.23,-90,90), [[0.18,0.48]]),
      [[0.46,0.48],[0.86,0.98]]],
  S: [[[0.78,0.14],[0.6,0.04],[0.35,0.05],[0.2,0.16],[0.18,0.3],[0.3,0.42],[0.5,0.48],[0.7,0.55],[0.82,0.68],[0.8,0.84],[0.62,0.96],[0.38,0.97],[0.2,0.88]]],
  T: [[[0.08,0.02],[0.92,0.02]], [[0.5,0.02],[0.5,0.98]]],
  U: [cat([[0.1,0.02],[0.1,0.68]], arcPts(0.5,0.68,0.4,0.3,180,0), [[0.9,0.02]])],
  V: [[[0.04,0.02],[0.5,0.98],[0.96,0.02]]],
  W: [[[0.02,0.02],[0.2,0.98],[0.5,0.35],[0.8,0.98],[0.98,0.02]]],
  X: [[[0.1,0.02],[0.9,0.98]], [[0.9,0.02],[0.1,0.98]]],
  Y: [[[0.05,0.02],[0.5,0.45],[0.95,0.02]], [[0.5,0.45],[0.5,0.98]]],
  Z: [[[0.1,0.02],[0.9,0.02],[0.1,0.98],[0.9,0.98]]],

  a: [arcPts(0.44,0.55,0.34,0.42,-90,270,24), [[0.78,0.14],[0.78,0.97]]],
  b: [[[0.2,0.02],[0.2,0.98]], arcPts(0.47,0.72,0.29,0.26,180,540,24)],
  d: [arcPts(0.47,0.72,0.29,0.26,-90,270,24), [[0.76,0.02],[0.76,0.98]]],
  e: [[[0.14,0.52],[0.84,0.52]], arcPts(0.5,0.52,0.36,0.42,0,-300,24)],
  f: [[[0.72,0.06],[0.52,0.02],[0.38,0.1],[0.36,0.3],[0.36,0.98]], [[0.16,0.36],[0.62,0.36]]],
  g: [arcPts(0.44,0.3,0.32,0.26,-90,270,24),
      cat([[0.76,0.06],[0.76,0.72]], arcPts(0.5,0.72,0.26,0.24,0,180))],
  h: [[[0.16,0.02],[0.16,0.98]],
      cat([[0.16,0.6]], arcPts(0.48,0.58,0.32,0.2,180,360), [[0.8,0.98]])],
  i: [[[0.5,0.32],[0.5,0.96]], [[0.5,0.06],[0.5,0.14]]],
  j: [cat([[0.68,0.32],[0.68,0.72]], arcPts(0.42,0.72,0.26,0.24,0,180)), [[0.68,0.06],[0.68,0.14]]],
  k: [[[0.18,0.02],[0.18,0.98]], [[0.75,0.35],[0.24,0.6],[0.8,0.98]]],
  l: [[[0.5,0.02],[0.5,0.98]]],
  m: [[[0.08,0.32],[0.08,0.98]],
      cat([[0.08,0.55]], arcPts(0.29,0.55,0.21,0.2,180,360), [[0.5,0.98]]),
      cat([[0.5,0.55]], arcPts(0.71,0.55,0.21,0.2,180,360), [[0.92,0.98]])],
  n: [[[0.14,0.32],[0.14,0.98]],
      cat([[0.14,0.58]], arcPts(0.48,0.58,0.34,0.24,180,360), [[0.82,0.98]])],
  p: [[[0.2,0.04],[0.2,0.98]], arcPts(0.48,0.3,0.3,0.26,180,540,24)],
  q: [[[0.8,0.04],[0.8,0.9],[0.68,0.98]], arcPts(0.5,0.3,0.3,0.26,-90,270,24)],
  r: [[[0.16,0.32],[0.16,0.98]],
      cat([[0.16,0.58]], arcPts(0.42,0.58,0.26,0.22,180,330))],
  t: [[[0.5,0.04],[0.5,0.85],[0.66,0.96]], [[0.2,0.32],[0.8,0.32]]],
  u: [cat([[0.12,0.32],[0.12,0.68]], arcPts(0.45,0.68,0.33,0.28,180,0), [[0.78,0.32]]),
      [[0.78,0.32],[0.78,0.98]]],
  y: [[[0.06,0.04],[0.48,0.42],[0.9,0.04]], [[0.48,0.42],[0.34,0.85],[0.18,0.96]]]
};
// 形狀與大寫相同的小寫，直接共用模板（大小寫由碰線位置判斷）
TEMPLATES.c = TEMPLATES.C;
TEMPLATES.o = TEMPLATES.O;
TEMPLATES.s = TEMPLATES.S;
TEMPLATES.v = TEMPLATES.V;
TEMPLATES.w = TEMPLATES.W;
TEMPLATES.x = TEMPLATES.X;
TEMPLATES.z = TEMPLATES.Z;

// 常見的另一種寫法（多給一個模板，符合任一就算像）
const VARIANTS = {
  I: [[[[0.5,0.02],[0.5,0.98]]]],
  J: [[[[0.45,0.02],[0.95,0.02]], cat([[0.78,0.02],[0.78,0.7]], arcPts(0.5,0.7,0.28,0.28,0,180))]],
  a: [[[[0.8,0.28],[0.62,0.15],[0.35,0.17],[0.17,0.38],[0.15,0.68],[0.3,0.9],[0.55,0.95],[0.8,0.8]],
       [[0.8,0.2],[0.8,0.95]]]],
  g: [[arcPts(0.45,0.25,0.3,0.22,-90,270,24),
       [[0.75,0.1],[0.75,0.55]],
       arcPts(0.48,0.78,0.28,0.2,-90,270,24)]],
  l: [[[[0.5,0.02],[0.48,0.88],[0.62,0.98]]]],
  y: [[[[0.06,0.04],[0.5,0.45],[0.9,0.04],[0.5,0.45],[0.38,0.96]]]],
  t: [[[[0.5,0.04],[0.5,0.98]], [[0.2,0.32],[0.8,0.32]]]]
};

const GRID = 28;

function sampleStroke(pts, step) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    if (i === 0) { out.push(pts[0]); continue; }
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    const d = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(1, Math.floor(d / step));
    for (let k = 1; k <= n; k++) out.push([x1 + (x2 - x1) * k / n, y1 + (y2 - y1) * k / n]);
  }
  return out;
}

// 把點集合縮放進 GRID x GRID（長寬各自拉滿，消除學生寫得胖瘦的差異），回傳有墨的格子清單
function rasterize(points) {
  if (!points.length) return [];
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const [x, y] of points) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  let w = Math.max(maxX - minX, 1e-6), h = Math.max(maxY - minY, 1e-6);
  // 像 l、i 這種幾乎一條直線的字母，寬度太小會被拉歪，先把方框補到至少 25% 的長寬比
  if (w < 0.25 * h) { const cx = (minX + maxX) / 2; w = 0.25 * h; minX = cx - w / 2; }
  if (h < 0.25 * w) { const cy = (minY + maxY) / 2; h = 0.25 * w; minY = cy - h / 2; }
  const usable = GRID - 2;
  const sx = usable / w, sy = usable / h;
  const cells = new Set();
  for (const [x, y] of points) {
    const gx = Math.min(GRID - 1, Math.max(0, Math.round(1 + (x - minX) * sx)));
    const gy = Math.min(GRID - 1, Math.max(0, Math.round(1 + (y - minY) * sy)));
    cells.add(gx + "," + gy);
  }
  return [...cells].map(s => s.split(",").map(Number));
}

// 水平距離打折：學生寫字常帶一點傾斜，橫向偏移不要罰太重（鏡像字 b/d 的左右差異仍然夠大）
const DX_WEIGHT = 0.65;
function cellDist2(ax, ay, bx, by) {
  const dx = (ax - bx) * DX_WEIGHT, dy = ay - by;
  return dx * dx + dy * dy;
}
function meanNearest(A, B) {
  if (!A.length || !B.length) return 99;
  let sum = 0;
  for (const [ax, ay] of A) {
    let best = 1e9;
    for (const [bx, by] of B) {
      const d = cellDist2(ax, ay, bx, by);
      if (d < best) best = d;
    }
    sum += Math.sqrt(best);
  }
  return sum / A.length;
}
function chamfer(A, B) {
  return (meanNearest(A, B) + meanNearest(B, A)) / 2;
}
// 距離超過門檻的格子比例（鏡像字 b/d 這種「一半對、一半錯位」的會被抓出來）
function farFrac(A, B, th) {
  if (!A.length || !B.length) return 1;
  let f = 0;
  for (const [ax, ay] of A) {
    let best = 1e9;
    for (const [bx, by] of B) {
      const d = cellDist2(ax, ay, bx, by);
      if (d < best) best = d;
    }
    if (Math.sqrt(best) > th) f++;
  }
  return f / A.length;
}
function shapeScore(A, B) {
  return chamfer(A, B) + 1.5 * (farFrac(A, B, 2) + farFrac(B, A, 2)) / 2;
}

// 模板格子預先算好
const TEMPLATE_CELLS = {};
function templateCellsFor(letter) {
  if (TEMPLATE_CELLS[letter]) return TEMPLATE_CELLS[letter];
  const variants = [TEMPLATES[letter], ...(VARIANTS[letter] || [])];
  const list = variants.map(strokes => {
    const pts = [];
    for (const st of strokes) for (const p of sampleStroke(st, 0.012)) pts.push(p);
    return rasterize(pts);
  });
  TEMPLATE_CELLS[letter] = list;
  return list;
}

// studentStrokes: [{x,y}...] 陣列的陣列（畫布像素座標）
// 回傳 {score, bestLetter, bestScore}：score 是與預期字母的距離（越小越像）
function recognizeShape(studentStrokes, expected) {
  const pts = [];
  for (const st of studentStrokes) {
    const arr = st.map(p => [p.x, p.y]);
    for (const p of sampleStroke(arr, 2)) pts.push(p);
  }
  const cells = rasterize(pts);
  if (cells.length < 4) return { score: 99, bestLetter: null, bestScore: 99 };
  let bestLetter = null, bestScore = 99, expectedScore = 99;
  for (const letter of Object.keys(TEMPLATES)) {
    let s = 99;
    for (const tc of templateCellsFor(letter)) s = Math.min(s, shapeScore(cells, tc));
    if (letter === expected) expectedScore = s;
    if (s < bestScore) { bestScore = s; bestLetter = letter; }
  }
  return { score: expectedScore, bestLetter, bestScore };
}

// 形狀門檻（格子距離）：<= PASS 算像，>= FAIL 算不像，中間算不確定
const SHAPE_PASS = 1.55;
const SHAPE_FAIL = 2.25;

// 特殊檢查：a/o、Q/O 只差一小筆，模板距離分不出來，用特徵補判。
// 回傳 fail 原因字串，或 null（沒問題）
function specialChecks(studentStrokes, expected) {
  const pts = [];
  for (const st of studentStrokes) {
    const arr = st.map(p => [p.x, p.y]);
    for (const [x, y] of sampleStroke(arr, 3)) pts.push({ x, y });
  }
  if (pts.length < 6) return null;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const W = Math.max(maxX - minX, 1e-6), H = Math.max(maxY - minY, 1e-6);
  if (expected === "a") {
    // a 右邊要有一根直直的豎線：右側 20% 區域在上下五段裡至少四段都有筆跡
    const bands = new Set();
    for (const p of pts) {
      if (p.x >= minX + 0.8 * W) bands.add(Math.min(4, Math.floor((p.y - minY) / H * 5)));
    }
    if (bands.size <= 3) return "a 右邊要有一根直直的豎線喔";
  }
  if (expected === "Q") {
    // Q 右下角要有一撇尾巴伸到角落
    const hasTail = pts.some(p => p.x >= minX + 0.86 * W && p.y >= minY + 0.92 * H);
    if (!hasTail) return "Q 右下角要有一撇尾巴喔";
  }
  if (expected === "O" || expected === "o") {
    const hasTail = pts.some(p => p.x >= minX + 0.85 * W && p.y >= minY + 0.9 * H);
    if (hasTail) return "這比較像 Q，O 不用加尾巴喔";
  }
  return null;
}

// 綜合判定：回傳 "pass" / "fail" / "uncertain"
// 若最像的是另一個字母（大小寫視為同一個字母，交給碰線判斷分大小寫）
// 而且明顯比預期字母像很多，代表學生寫的是別的字母，直接判 fail。
function shapeVerdict(rec, expected) {
  const otherLetter = rec.bestLetter &&
    rec.bestLetter.toLowerCase() !== expected.toLowerCase();
  const clearlyOther = otherLetter && rec.bestScore <= SHAPE_PASS &&
    rec.bestScore < rec.score * 0.7;
  if (clearlyOther) return { verdict: "fail", looksLike: rec.bestLetter };
  if (rec.score <= SHAPE_PASS) return { verdict: "pass", looksLike: null };
  if (rec.score >= SHAPE_FAIL) return { verdict: "fail", looksLike: otherLetter ? rec.bestLetter : null };
  return { verdict: "uncertain", looksLike: null };
}

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  // 書寫線位置（佔書寫區高度的比例）：上線 / 中線 / 下線(基線) / 下伸線
  const LINE = { top: 0.08, mid: 0.38, base: 0.68, desc: 0.95 };

  // 小寫字母分類
  const ASCENDER = new Set("bdfhkl");   // 要碰到上線：b d f h k l
  const DESCENDER = new Set("gjpqy");   // 要往下伸：g j p q y
  // t 比較特別：比中線高、不到上線也可以
  // 其餘 a c e i m n o r s u v w x z：只要中線到下線

  let questions = [], index = 0, results = [], strokes = [], locked = false;
  let activePointer = null, currentStroke = null;
  let uncertainCount = 0;

  // 忽略離主體很遠的誤觸小筆（手掌碰到螢幕多出來的一點），i、j 的點離主體近，不會被刪
  function filterStrays(list, H) {
    if (list.length <= 1) return list;
    const info = list.map(st => {
      let len = 0, cx = 0, cy = 0;
      st.forEach((p, i) => { cx += p.x; cy += p.y; if (i) len += Math.hypot(p.x - st[i-1].x, p.y - st[i-1].y); });
      return { st, len, cx: cx / st.length, cy: cy / st.length };
    });
    let tw = 0, mx = 0, my = 0;
    info.forEach(o => { const w = Math.max(o.len, 1); tw += w; mx += o.cx * w; my += o.cy * w; });
    mx /= tw; my /= tw;
    const kept = info.filter(o => !(o.len < 0.015 * H && Math.hypot(o.cx - mx, o.cy - my) > 0.45 * H));
    return kept.length ? kept.map(o => o.st) : list;
  }
  let lastW = 0, lastH = 0;

  const canvas = $("canvas"), ctx = canvas.getContext("2d"), guide = $("guide");

  // ---------- 出題：大寫→小寫 15 題 + 小寫→大寫 15 題，隨機排列 ----------
  function makeQuestions() {
    const qs = [];
    for (let i = 0; i < 15; i++) qs.push({ letter: alphabet[Math.floor(Math.random() * 26)], askUpper: true });
    for (let i = 0; i < 15; i++) qs.push({ letter: alphabet[Math.floor(Math.random() * 26)], askUpper: false });
    // askUpper=true：題目是大寫，要寫小寫；false：題目是小寫，要寫大寫
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    // 避免連續兩題同一個字母
    for (let i = 1; i < qs.length; i++) {
      if (qs[i].letter === qs[i - 1].letter) {
        const j = (i + 7) % qs.length;
        [qs[i], qs[j]] = [qs[j], qs[i]];
      }
    }
    return qs;
  }

  function answerOf(q) { return q.askUpper ? q.letter.toLowerCase() : q.letter; }

  function hintOf(q) {
    const ans = answerOf(q);
    if (!q.askUpper) return "大寫 " + ans + "：要碰到上線和下線";
    const l = ans;
    if (ASCENDER.has(l)) return "小寫 " + l + "：要碰到上線和下線";
    if (DESCENDER.has(l)) return "小寫 " + l + "：從中線寫到下伸線，要往下伸";
    if (l === "t") return "小寫 t：要比中線高一點，寫到下線";
    return "小寫 " + l + "：只要寫在中線和下線之間";
  }

  // JUDGE_START
  // 判斷筆跡位置是否符合該字母應該碰到的線。
  // strokes：筆畫陣列（每筆是 {x,y} 陣列，CSS 像素座標）；H：書寫區高度；answer：正確答案字母（大小寫已定）
  function judgeWriting(strokes, H, answer) {
    const topY = LINE.top * H, midY = LINE.mid * H, baseY = LINE.base * H, descY = LINE.desc * H;
    const S = midY - topY;              // 一格的高度
    const tol = 0.42 * S;               // 碰線容許誤差
    const reasons = [];

    // i、j 的點是獨立一小筆且在中線上面，判斷高度時不算那個點
    const isLower = answer === answer.toLowerCase();
    let bodyStrokes = strokes;
    if (isLower && (answer === "i" || answer === "j")) {
      const filtered = strokes.filter(st => {
        if (!st.length) return false;
        const ys = st.map(p => p.y);
        const h = Math.max(...ys) - Math.min(...ys);
        const aboveMid = Math.max(...ys) < midY - 0.05 * S;
        return !(aboveMid && h < 0.55 * S);   // 點：位置在中線上方、而且很短
      });
      if (filtered.length) bodyStrokes = filtered;
    }

    const pts = bodyStrokes.flat();
    if (pts.length < 6) return { ok: false, reasons: ["請先在格子內寫出字母喔！"] };
    const minY = Math.min(...pts.map(p => p.y));
    const maxY = Math.max(...pts.map(p => p.y));

    const reachTop = minY <= topY + tol;
    const reachMid = minY <= midY + tol;
    const tooTall = minY < midY - 0.7 * S;
    const reachBase = maxY >= baseY - tol;
    const tooLow = maxY > baseY + 0.45 * (descY - baseY);
    const reachDesc = maxY >= baseY + 0.3 * (descY - baseY);

    if (!isLower || ASCENDER.has(answer)) {
      // 大寫 A–Z、小寫 b d f h k l：上線 + 下線
      if (!reachTop) reasons.push("上面還沒碰到上線喔");
      if (!reachBase) reasons.push("下面還沒碰到下線喔");
    } else if (DESCENDER.has(answer)) {
      // 小寫 g j p q y：中線起筆、往下伸到下伸線方向
      if (!reachMid) reasons.push("上面還沒碰到中線喔");
      if (tooTall) reasons.push("寫太高了，這個字母從中線開始寫");
      if (!reachDesc) reasons.push("這個字母要往下伸，寫到下線下面喔");
    } else if (answer === "t") {
      if (minY > midY - 0.15 * S) reasons.push("t 要寫得比中線高一點喔");
      if (!reachBase) reasons.push("下面還沒碰到下線喔");
      if (tooLow) reasons.push("寫太下面了，要停在下線喔");
    } else {
      // 其餘小寫：中線 + 下線，不可太高、不可下伸
      if (!reachMid) reasons.push("上面還沒碰到中線喔");
      if (tooTall) reasons.push("寫太高了，這個小寫字母只要到中線");
      if (!reachBase) reasons.push("下面還沒碰到下線喔");
      if (tooLow) reasons.push("寫太下面了，要停在下線喔");
    }
    return { ok: reasons.length === 0, reasons };
  }
  // JUDGE_END

  // ---------- 畫布 ----------
  function positionLabels() {
    document.querySelectorAll(".linelabel").forEach(el => {
      el.style.top = (LINE[el.dataset.line] * 100) + "%";
    });
  }

  function resizeCanvas() {
    const rect = guide.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
    if (lastW && lastH && (w !== lastW || h !== lastH)) {
      const sx = w / lastW, sy = h / lastH;
      strokes.forEach(st => st.forEach(p => { p.x *= sx; p.y *= sy; }));
    }
    lastW = w; lastH = h;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    positionLabels();
    redraw();
  }

  function redraw() {
    const w = lastW, h = lastH;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    // 淺色直線，形成方格
    const cell = (LINE.mid - LINE.top) * h;
    ctx.strokeStyle = "#eef2f7"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = cell; x < w; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    ctx.stroke();
    // 四條基準線
    const lines = [
      [LINE.top, "#df7373"], [LINE.mid, "#e3a008"], [LINE.base, "#7aa7e0"], [LINE.desc, "#b79ced"]
    ];
    lines.forEach(([r, color]) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, r * h); ctx.lineTo(w, r * h); ctx.stroke();
    });
    // 筆跡
    ctx.strokeStyle = "#245db5"; ctx.lineWidth = Math.max(4, h * 0.016);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    strokes.forEach(st => {
      if (!st.length) return;
      ctx.beginPath(); ctx.moveTo(st[0].x, st[0].y);
      st.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
      if (st.length === 1) ctx.lineTo(st[0].x + .1, st[0].y + .1);
      ctx.stroke();
    });
  }

  function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", e => {
    if (locked || activePointer !== null) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    activePointer = e.pointerId;
    currentStroke = [pointFromEvent(e)];
    strokes.push(currentStroke);
    redraw();
  });
  canvas.addEventListener("pointermove", e => {
    if (locked || e.pointerId !== activePointer || !currentStroke) return;
    e.preventDefault();
    const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evts.forEach(ev => currentStroke.push(pointFromEvent(ev)));
    redraw();
  });
  function endStroke(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null; currentStroke = null;
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  function snapshot() {
    try {
      const off = document.createElement("canvas");
      const scale = 220 / Math.max(1, lastW);
      off.width = 220; off.height = Math.round(lastH * scale);
      const octx = off.getContext("2d");
      octx.fillStyle = "#fff"; octx.fillRect(0, 0, off.width, off.height);
      octx.drawImage(canvas, 0, 0, off.width, off.height);
      return off.toDataURL("image/png");
    } catch (_) { return ""; }
  }

  // ---------- 流程 ----------
  function clearWriting() {
    strokes = []; currentStroke = null; activePointer = null; redraw();
    $("feedback").textContent = ""; $("answer").textContent = "?";
  }

  function updateLiveScore() {
    const ok = results.filter(r => r.correct).length;
    $("liveCorrect").textContent = ok;
    $("liveWrong").textContent = results.length - ok;
  }

  function showQuestion() {
    locked = false; uncertainCount = 0; clearWriting();
    const q = questions[index];
    $("prompt").textContent = q.askUpper ? q.letter : q.letter.toLowerCase();
    $("direction").textContent = q.askUpper ? "看到大寫，請寫出對應的小寫字母" : "看到小寫，請寫出對應的大寫字母";
    $("hint").textContent = hintOf(q);
    $("progress").textContent = "第 " + (index + 1) + " / 30 題";
    $("bar").style.width = (index / 30 * 100) + "%";
    $("check").disabled = false; $("clear").disabled = false; $("undo").disabled = false;
    $("next").hidden = true;
  }

  function start() {
    questions = makeQuestions(); index = 0; results = [];
    $("game").hidden = false; $("result").hidden = true;
    updateLiveScore();
    showQuestion();
  }

  function checkAnswer() {
    if (locked) return;
    const q = questions[index];
    const expected = answerOf(q);
    const cleanStrokes = filterStrays(strokes, lastH);
    const pos = judgeWriting(cleanStrokes, lastH, expected);
    if (!pos.ok && pos.reasons[0] === "請先在格子內寫出字母喔！") {
      $("feedback").innerHTML = "✏️ 請先在格子內寫出字母喔！";
      $("feedback").style.color = "#b7791f";
      return;
    }
    const rec = recognizeShape(cleanStrokes, expected);
    const sv = shapeVerdict(rec, expected);
    const special = specialChecks(cleanStrokes, expected);
    let shapeVerdictFinal = sv.verdict;
    // a/o、Q/O 這種只差一小筆的特徵檢查，先當不確定處理：請學生重寫，不直接判錯
    if (special && shapeVerdictFinal === "pass") shapeVerdictFinal = "uncertain";

    // 形狀看不清楚：先不算錯，請學生重寫（每題最多 2 次）
    if (shapeVerdictFinal === "uncertain" && uncertainCount < 2) {
      uncertainCount++;
      $("feedback").innerHTML = special
        ? "🤔 " + special + "，請按「清除重寫」再寫一次（不算錯）"
        : "🤔 寫得不太清楚喔，請按「清除重寫」再寫一次（不算錯）";
      $("feedback").style.color = "#b7791f";
      return;
    }

    const shapeOk = shapeVerdictFinal === "pass";
    const correct = pos.ok && shapeOk;
    const reasons = [...pos.reasons];
    if (!shapeOk) {
      if (special) reasons.push(special);
      else if (sv.looksLike) reasons.push("形狀不太像「" + expected + "」，比較像「" + sv.looksLike + "」");
      else reasons.push("形狀不太像「" + expected + "」，再看一次題目寫寫看");
    }
    results.push({ q, correct, expected, reasons, img: snapshot() });
    updateLiveScore();
    locked = true;
    $("answer").textContent = expected;
    if (correct) {
      $("feedback").innerHTML = "✓ 太棒了！形狀和位置都正確！";
      $("feedback").style.color = "var(--green)";
    } else {
      $("feedback").innerHTML = "再加油！正確答案是「" + expected + "」<span class='why'>" + reasons.join("；") + "</span>";
      $("feedback").style.color = "var(--red)";
    }
    $("check").disabled = true; $("clear").disabled = true; $("undo").disabled = true;
    $("next").hidden = false;
    $("next").textContent = index === 29 ? "查看測驗結果 →" : "下一題 →";
    $("bar").style.width = ((index + 1) / 30 * 100) + "%";
  }

  function finish() {
    $("game").hidden = true; $("result").hidden = false;
    const correctCount = results.filter(r => r.correct).length, wrongCount = 30 - correctCount;
    $("progress").textContent = "30 / 30"; $("bar").style.width = "100%";
    $("score").textContent = correctCount + " / 30";
    $("correct").textContent = correctCount; $("wrong").textContent = wrongCount;
    const allRight = wrongCount === 0;
    $("trophy").textContent = allRight ? "🌟" : "📝";
    $("trophy").classList.toggle("gold", allRight);
    $("resultTitle").textContent = allRight ? "恭喜過關！" : "測驗完成！";
    $("message").textContent = allRight ? "太厲害了！30 題全部答對！" : "這一次答對 " + correctCount + " 題，繼續努力！";
    $("passText").textContent = allRight
      ? "🏆 英文大小寫書寫小達人・金色星星獎勵"
      : "還差 " + wrongCount + " 題就能獲得金色星星，看看答錯的題目再挑戰一次！";
    $("errors").hidden = true;
    $("review").textContent = "查看答錯題目 (" + wrongCount + ")";
    $("result").scrollTop = 0;
  }

  $("clear").addEventListener("click", clearWriting);
  $("undo").addEventListener("click", () => { strokes.pop(); redraw(); });
  $("check").addEventListener("click", checkAnswer);
  $("next").addEventListener("click", () => { index++; if (index >= 30) finish(); else showQuestion(); });
  $("restart").addEventListener("click", start);
  $("reshuffle").addEventListener("click", start);
  $("review").addEventListener("click", () => {
    const area = $("errors");
    if (!area.hidden) { area.hidden = true; return; }
    const bad = results.map((r, i) => ({ ...r, n: i + 1 })).filter(r => !r.correct);
    area.hidden = false;
    area.innerHTML = bad.length
      ? "<h3 style='text-align:left'>錯題檢討</h3>" + bad.map(r =>
          "<div class='row'>" +
          (r.img ? "<img src='" + r.img + "' alt='第 " + r.n + " 題的書寫'>" : "") +
          "<div class='meta'><b>第 " + r.n + " 題</b>　" +
          (r.q.askUpper ? r.q.letter + " → 小寫" : r.q.letter.toLowerCase() + " → 大寫") +
          "<div class='muted'>正確答案：" + r.expected + "｜" + hintOf(r.q) + "</div>" +
          "<div class='muted' style='color:var(--red)'>" + r.reasons.join("；") + "</div></div>" +
          "<b style='color:var(--red)'>需加強</b></div>").join("")
      : "<p style='color:var(--green);font-weight:700'>太棒了！沒有錯題！</p>";
  });

  if ("ResizeObserver" in window) new ResizeObserver(resizeCanvas).observe(guide);
  else window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));
  resizeCanvas();
  start();
})();
</script>
